<!doctype html>
<html lang="ru"><head><meta charset="utf-8">
<style>
@font-face { font-family: "Display"; src: url(__FONT_SANS__) format("truetype"); font-weight: 100 900; }
@font-face { font-family: "Mono"; src: url(__FONT_MONO__) format("truetype"); }
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 1280px; height: 720px; overflow: hidden; background: #0b0614; }
body { font-family: "Display", system-ui, sans-serif; color: #fff; position: relative; }
.layer { position: absolute; inset: 0; }
#base { background: #0b0614; }
.glow { position: absolute; width: 760px; height: 760px; border-radius: 50%; }
.dot { position: absolute; border-radius: 50%; background: rgba(220,190,255,.55); }
#vignette { background: radial-gradient(ellipse at center, transparent 45%, rgba(4,2,10,.75) 100%); }
#grain { opacity: .07; mix-blend-mode: overlay; background-size: 220px 220px; inset: -20px;
  background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='220' height='220' filter='url(%23n)'/></svg>"); }
#cam { position: absolute; inset: 0; will-change: transform; }

/* сцены */
.vis { position: absolute; inset: 0; opacity: 0; display: flex; flex-direction: column;
  align-items: center; justify-content: center; text-align: center; padding: 140px 90px 200px; }
.date .main { font-size: 88px; font-weight: 800; text-transform: uppercase; line-height: 1.05; }
.date .bar { height: 8px; width: 0; background: linear-gradient(90deg, #b45cff, #5b8cff); border-radius: 4px; margin-top: 26px; }
.date .sub { font-size: 34px; font-weight: 500; color: #cdb8ee; margin-top: 22px; }
.stat .num { font-size: 230px; font-weight: 900; line-height: 1; font-variant-numeric: tabular-nums; }
.stat .num span { font-size: 120px; font-weight: 800; color: #c89bff; margin-left: 10px; }
.stat .track { width: 620px; height: 12px; border-radius: 6px; background: rgba(255,255,255,.14); margin-top: 20px; overflow: hidden; }
.stat .fill { height: 100%; width: 0; background: linear-gradient(90deg, #b45cff, #5b8cff); }
.stat .cap { font-size: 38px; font-weight: 600; color: #e4d6fb; margin-top: 30px; max-width: 900px; line-height: 1.25; }
.verdict { gap: 16px; }
.card { width: 820px; padding: 16px 34px; border-radius: 18px; background: rgba(30,18,52,.82);
  border: 2px solid rgba(190,140,255,.35); text-align: left; opacity: 0; }
.card .k { font-size: 24px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; }
.card .v { font-size: 36px; font-weight: 600; margin-top: 2px; line-height: 1.2; }
.card.ok { border-color: #5dffb0; } .card.ok .k { color: #5dffb0; }
.card.warn { border-color: #ffb347; } .card.warn .k { color: #ffb347; }
.card.no { border-color: #ff6b7a; } .card.no .k { color: #ff6b7a; }
.analogy { flex-direction: row; gap: 34px; }
.analogy .box { width: 470px; padding: 34px 30px; border-radius: 22px; background: rgba(30,18,52,.85);
  border: 2px solid rgba(190,140,255,.4); opacity: 0; }
.analogy .box .t { font-size: 52px; font-weight: 800; }
.analogy .box .s { font-size: 30px; color: #cdb8ee; margin-top: 12px; line-height: 1.25; }
.analogy .eq { font-size: 90px; font-weight: 800; color: #c89bff; opacity: 0; }
.quote .q { font-size: 72px; font-weight: 800; line-height: 1.18; max-width: 1060px; }
.quote .q .w { opacity: 0; display: inline-block; margin: 0 .13em; }
.quote .q .w.hl { color: #d2a6ff; }
/* хронология по горизонтали */
.timeline .tl { position: relative; width: 1080px; height: 300px; }
.timeline .line { position: absolute; left: 0; top: 150px; height: 6px; width: 0; border-radius: 3px; background: linear-gradient(90deg, #b45cff, #5b8cff); }
.timeline .pt { position: absolute; top: 0; width: 260px; margin-left: -130px; text-align: center; opacity: 0; }
.timeline .pt .y { white-space: nowrap; font-size: 50px; font-weight: 900; color: #d2a6ff; height: 110px; display: flex; align-items: flex-end; justify-content: center; font-variant-numeric: tabular-nums; }
.timeline .pt .d { width: 26px; height: 26px; border-radius: 50%; background: #fff; border: 6px solid #b45cff; margin: 26px auto 22px; }
.timeline .pt .t { font-size: 31px; font-weight: 600; line-height: 1.2; color: #f1e8ff; }
/* схема с иконками */
.flow { flex-direction: row; gap: 0; }
.flow .fn { width: 230px; opacity: 0; }
.flow .ico { width: 132px; height: 132px; border-radius: 50%; margin: 0 auto; display: flex; align-items: center; justify-content: center;
  background: rgba(40,22,70,.9); border: 3px solid #b45cff; box-shadow: 0 0 40px rgba(180,92,255,.45); }
.flow svg { width: 70px; height: 70px; fill: none; stroke: #fff; stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; }
.flow .lb { font-size: 32px; font-weight: 700; margin-top: 20px; line-height: 1.15; }
.flow .cn { width: 90px; height: 6px; margin-top: -58px; position: relative; background: rgba(255,255,255,.16); border-radius: 3px; overflow: visible; }
.flow .cn i { position: absolute; left: 0; top: 0; height: 100%; width: 0; background: linear-gradient(90deg, #b45cff, #5b8cff); border-radius: 3px; }
.flow .cn b { position: absolute; top: -5px; width: 16px; height: 16px; border-radius: 50%; background: #fff; box-shadow: 0 0 14px #b45cff; opacity: 0; }
/* столбцы */
.bars { gap: 18px; align-items: stretch; }
.bars .br { display: flex; align-items: center; gap: 24px; width: 1020px; margin: 0 auto; opacity: 0; }
.bars .bl { width: 270px; text-align: right; font-size: 34px; font-weight: 700; }
.bars .bt { flex: 1; height: 46px; border-radius: 10px; background: rgba(255,255,255,.1); overflow: hidden; }
.bars .bf { height: 100%; width: 0; background: linear-gradient(90deg, #b45cff, #5b8cff); border-radius: 10px; }
.bars .br.warn .bf { background: linear-gradient(90deg, #ff9a3c, #ffcf5c); } .bars .br.no .bf { background: linear-gradient(90deg, #ff4d6d, #ff8a9b); }
.bars .bv { width: 150px; text-align: left; font-size: 40px; font-weight: 800; font-variant-numeric: tabular-nums; }
/* «архивный» плакат */
.poster .paper { width: 760px; padding: 34px 46px 30px; background: linear-gradient(135deg, #f3e8cf, #e2d3ae); color: #2a1c0e;
  font-family: "DejaVu Serif", Georgia, "Times New Roman", serif; border: 7px double #2a1c0e; box-shadow: 0 30px 60px rgba(0,0,0,.55); opacity: 0; }
.poster h1 { font-size: 70px; line-height: 1.02; font-weight: 800; text-transform: uppercase; letter-spacing: .01em; }
.poster p { font-size: 30px; line-height: 1.3; margin-top: 16px; border-top: 3px solid #2a1c0e; padding-top: 14px; }
.poster em { display: block; font-size: 22px; margin-top: 14px; opacity: .75; }
/* крупная иконка */
.icon svg { width: 230px; height: 230px; fill: none; stroke: #d2a6ff; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; filter: drop-shadow(0 0 28px rgba(180,92,255,.7)); }
.icon .big { font-size: 96px; font-weight: 900; margin-top: 8px; }
.icon .cap { font-size: 36px; font-weight: 600; color: #e4d6fb; margin-top: 10px; }

/* терминал: настоящие строки из материала выглядят убедительнее иконок */
.terminal .win { width: 1040px; border-radius: 14px; background: rgba(8,6,16,.94); border: 1px solid rgba(190,140,255,.35);
  box-shadow: 0 30px 70px rgba(0,0,0,.6); overflow: hidden; text-align: left; }
.terminal .bar { height: 40px; background: rgba(42,30,74,.95); display: flex; align-items: center; gap: 9px; padding: 0 16px; }
.terminal .bar i { width: 13px; height: 13px; border-radius: 50%; display: block; }
.terminal .bar span { margin-left: 14px; font-family: "Mono", monospace; font-size: 16px; color: #a898c8; }
.terminal .body { padding: 22px 28px 26px; font-family: "Mono", monospace; font-size: 29px; line-height: 1.6; min-height: 320px; }
.terminal .ln { white-space: pre; color: #cfc3ee; min-height: 40px; }
.terminal .kw { font-weight: 700; } .terminal .kw.create { color: #5dffb0; } .terminal .kw.delete { color: #ff6b7a; }
.terminal .kw.rename { color: #ffb347; } .terminal .kw.other { color: #8fb8ff; }
.terminal .note { color: #8f80b3; }
.quote .q.glitch { will-change: transform, text-shadow; }

/* постоянные элементы */
#tag { position: absolute; left: 44px; top: 36px; display: flex; align-items: center; gap: 14px; opacity: 0; }
#tag i { width: 10px; height: 38px; border-radius: 5px; background: linear-gradient(#b45cff, #5b8cff); }
#tag b { font-size: 26px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: #e8dcff; }
#chip { position: absolute; left: 44px; top: 92px; padding: 7px 18px; border-radius: 999px; border: 2px solid #b45cff;
  background: rgba(40,22,70,.85); font-size: 22px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; opacity: 0; }
#brand { position: absolute; right: 44px; top: 40px; font-size: 22px; font-weight: 700; color: rgba(255,255,255,.55); letter-spacing: .06em; }
#sub { position: absolute; left: 0; right: 0; bottom: 56px; text-align: center; font-size: 46px; font-weight: 700; line-height: 1.2; padding: 0 140px; }
#sub .line { display: inline-block; padding: 8px 26px; border-radius: 14px; background: rgba(8,4,16,.62); }
#sub .w { display: inline-block; opacity: .6; margin: 0 .2em; } #sub .w.on { opacity: 1; } #sub .w.k { color: #d2a6ff; }
#prog { position: absolute; left: 0; bottom: 0; height: 6px; width: 0; background: linear-gradient(90deg, #b45cff, #5b8cff); }
#wipe { position: absolute; top: -80px; height: 880px; width: 1500px; left: 0; transform: skewX(-14deg); opacity: 0;
  background: linear-gradient(100deg, #6a2cff 0%, #b45cff 45%, #ff6bd6 100%); }
#wipe2 { position: absolute; top: -80px; height: 880px; width: 1500px; left: 0; transform: skewX(-14deg); opacity: 0; background: #0b0614; }
</style></head>
<body>
<div id="base" class="layer"></div>
<div id="glows" class="layer"></div>
<div id="pattern" class="layer"></div>
<div id="dots" class="layer"></div>
<div id="vignette" class="layer"></div>
<div id="cam"><div id="scene" class="layer"></div></div>
<div id="grain" class="layer"></div>
<div id="tag"><i></i><b id="tagtxt"></b></div>
<div id="chip"></div>
<div id="brand"></div>
<div id="sub"></div>
<div id="prog"></div>
<div id="wipe2"></div><div id="wipe"></div>
<script>
const C = __CONFIG__;
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const eo = p => 1 - Math.pow(1 - clamp(p), 3);
const eio = p => { p = clamp(p); return p < .5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2; };
const eob = p => { p = clamp(p); const c = 1.7; return 1 + (c + 1) * Math.pow(p - 1, 3) + c * Math.pow(p - 1, 2); };
const HUES = [272, 255, 290, 238, 305, 262, 225, 285];
let rs = 12345; const rnd = () => (rs = (rs * 1664525 + 1013904223) % 4294967296) / 4294967296;
const ICONS = {
  server: '<rect x="8" y="9" width="32" height="12" rx="3"/><rect x="8" y="27" width="32" height="12" rx="3"/><path d="M14 15h.01M14 33h.01"/>',
  db: '<ellipse cx="24" cy="12" rx="14" ry="6"/><path d="M10 12v24c0 3.3 6.3 6 14 6s14-2.7 14-6V12M10 24c0 3.3 6.3 6 14 6s14-2.7 14-6"/>',
  user: '<circle cx="24" cy="16" r="7"/><path d="M9 40c1-8 7-12 15-12s14 4 15 12"/>',
  queue: '<rect x="5" y="16" width="10" height="16" rx="2"/><rect x="19" y="16" width="10" height="16" rx="2"/><rect x="33" y="16" width="10" height="16" rx="2"/>',
  cloud: '<path d="M14 36a8 8 0 0 1-1-16 11 11 0 0 1 21-2 9 9 0 0 1 1 18z"/>',
  code: '<path d="M17 14L7 24l10 10M31 14l10 10-10 10M27 10l-6 28"/>',
  clock: '<circle cx="24" cy="24" r="16"/><path d="M24 14v10l7 4"/>',
  money: '<circle cx="24" cy="24" r="16"/><path d="M29 18c-1-2-3-3-5-3-3 0-5 1.5-5 4s2 3 5 4 5 1.5 5 4-2 4-5 4c-2 0-4-1-5-3M24 11v4M24 33v4"/>',
  shield: '<path d="M24 6l15 5v11c0 9-6 16-15 20C15 38 9 31 9 22V11z"/>',
  bolt: '<path d="M27 5L10 27h12l-3 16 19-23H26z"/>',
  box: '<path d="M24 6l16 8v20l-16 8-16-8V14zM8 14l16 8 16-8M24 22v20"/>',
};
const svgIcon = n => '<svg viewBox="0 0 48 48">' + (ICONS[n] || ICONS.box) + '</svg>';

const glows = [], dots = [], visEls = [];
let chunkEls = [], lastChunk = -2;
function el(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }

function buildVisual(v, idx) {
  const root = el('div', 'vis ' + v.type);
  const o = { v, root, idx, parts: [] };
  if (v.type === 'date') {
    o.main = el('div', 'main', v.text); o.bar = el('div', 'bar'); root.append(o.main, o.bar);
    if (v.sub) { o.sub = el('div', 'sub', v.sub); root.append(o.sub); }
  } else if (v.type === 'stat') {
    o.num = el('div', 'num'); o.numv = el('b'); o.unit = el('span', '', v.unit || ''); o.num.append(o.numv, o.unit);
    const tr = el('div', 'track'); o.fill = el('div', 'fill'); tr.append(o.fill);
    root.append(o.num, tr, el('div', 'cap', v.caption || ''));
    o.target = parseFloat(String(v.value).replace(',', '.')); o.dec = /[.,]/.test(String(v.value)) ? 1 : 0;
  } else if (v.type === 'verdict') {
    (v.items || []).forEach(it => { const c = el('div', 'card ' + (it.tone || 'ok')); c.append(el('div', 'k', it.k), el('div', 'v', it.v)); root.append(c); o.parts.push(c); });
  } else if (v.type === 'analogy') {
    const a = el('div', 'box'); a.append(el('div', 't', v.a), el('div', 's', v.a_sub || ''));
    const eq = el('div', 'eq', v.sign || '='); const b = el('div', 'box'); b.append(el('div', 't', v.b), el('div', 's', v.b_sub || ''));
    root.append(a, eq, b); o.parts = [a, eq, b];
  } else if (v.type === 'quote') {
    const q = el('div', 'q' + (v.glitch ? ' glitch' : '')); o.q = q; const L = (v.text || '').length;
    q.style.fontSize = L > 95 ? '46px' : L > 65 ? '56px' : '72px';   // длинная фраза не должна занимать весь экран
    (v.text || '').split(/\s+/).forEach(w => { const s = el('span', 'w' + (v.hl && v.hl.includes(w.replace(/[.,!?:;]/g, '')) ? ' hl' : ''), w); q.append(s); o.parts.push(s); });
    root.append(q);
  } else if (v.type === 'timeline') {
    const tl = el('div', 'tl'), n = (v.items || []).length; o.line = el('div', 'line'); tl.append(o.line);
    (v.items || []).forEach((it, i) => {
      const p = el('div', 'pt'); p.style.left = (n === 1 ? 540 : 130 + i * (820 / (n - 1))) + 'px';
      p.append(el('div', 'y', it.y), el('div', 'd'), el('div', 't', it.t)); tl.append(p); o.parts.push(p);
    });
    root.append(tl);
  } else if (v.type === 'flow') {
    (v.items || []).forEach((it, i) => {
      if (i > 0) { const cn = el('div', 'cn'); const f = el('i'); const dot = el('b'); cn.append(f, dot); root.append(cn); o.parts.push({ cn, f, dot }); }
      const n = el('div', 'fn'); const ic = el('div', 'ico'); ic.innerHTML = svgIcon(it.icon || it.k);
      n.append(ic, el('div', 'lb', it.label || it.v)); root.append(n); o.parts.push({ n });
    });
  } else if (v.type === 'bars') {
    const vals = (v.items || []).map(it => parseFloat(String(it.v).replace(/[^\d.,]/g, '').replace(',', '.')) || 0);
    o.max = Math.max(...vals, 1); o.vals = vals; o.unit = v.unit || '';
    (v.items || []).forEach((it, i) => {
      const r = el('div', 'br ' + (it.tone || '')); const bf = el('div', 'bf'), bv = el('div', 'bv');
      const bt = el('div', 'bt'); bt.append(bf); r.append(el('div', 'bl', it.k), bt, bv); root.append(r); o.parts.push({ r, bf, bv, val: vals[i] });
    });
  } else if (v.type === 'poster') {
    const p = el('div', 'paper'); p.append(el('h1', '', v.text)); if (v.sub) p.append(el('p', '', v.sub)); if (v.caption) p.append(el('em', '', v.caption));
    root.append(p); o.paper = p; o.rot = (idx % 2 ? 1.6 : -1.8);
  } else if (v.type === 'icon') {
    const w = el('div'); w.innerHTML = svgIcon(v.icon || v.a); root.append(w, el('div', 'big', v.text || ''));
    if (v.sub) root.append(el('div', 'cap', v.sub)); o.ico = w;
  } else if (v.type === 'terminal') {
    const win = el('div', 'win'), bar = el('div', 'bar');
    ['#ff5f57', '#febc2e', '#28c840'].forEach(c => { const d = el('i'); d.style.background = c; bar.append(d); });
    bar.append(el('span', '', v.title || 'terminal'));
    const body = el('div', 'body'); o.lines = [];
    (v.lines || []).forEach(raw => {
      const ln = el('div', 'ln'), m = /^(\S+)(\s.*)?$/.exec(raw) || [raw, raw, ''];
      const cls = /^(CREATE|ADD)$/i.test(m[1]) ? 'create' : /^(DELETE|REMOVE)$/i.test(m[1]) ? 'delete' : /^(RENAME|MOVE)$/i.test(m[1]) ? 'rename' : 'other';
      const kw = el('span', 'kw ' + cls), rest = el('span');
      ln.append(kw, rest); body.append(ln); o.lines.push({ kw, rest, k: m[1], r: m[2] || '' });
    });
    win.append(bar, body); root.append(win);
  }
  document.getElementById('scene').append(root);
  return o;
}

function layout() {
  document.getElementById('brand').textContent = C.brand || '';
  for (let i = 0; i < 3; i++) { const g = el('div', 'glow'); document.getElementById('glows').append(g); glows.push(g); }
  for (let i = 0; i < 34; i++) { const d = el('div', 'dot'); document.getElementById('dots').append(d); dots.push({ d, x: rnd() * 1280, y: rnd() * 720, sp: 6 + rnd() * 16, ph: rnd() * 6.28, sz: 2 + rnd() * 4 }); }
  let k = 0; C.chapters.forEach(ch => ch.visuals.forEach(v => visEls.push(buildVisual(v, k++))));
}
function chapterAt(t) { let k = 0; C.chapters.forEach((c, i) => { if (t >= c.s) k = i; }); return k; }

function bg(t, ci) {
  const ch = C.chapters[ci], prev = ci > 0 ? HUES[(ci - 1) % HUES.length] : HUES[0];
  const hue = prev + (HUES[ci % HUES.length] - prev) * eio((t - ch.s) / 1.4);
  document.getElementById('base').style.background = `radial-gradient(ellipse at 30% 20%, hsl(${hue} 55% 15%), hsl(${hue + 20} 60% 6%) 75%)`;
  glows.forEach((g, i) => {
    const x = 640 + Math.sin(t * .11 + i * 2.1) * 430 - 380, y = 360 + Math.cos(t * .09 + i * 1.7) * 220 - 380;
    g.style.transform = `translate(${x}px, ${y}px)`;
    g.style.background = `radial-gradient(circle, hsla(${hue + i * 28} 85% 55% / ${.22 - i * .04}), transparent 62%)`;
  });
  // узор фона меняется по главам: сетка, диагонали, кольца
  const pt = document.getElementById('pattern'), st = ci % 3;
  if (st === 0) {
    pt.style.opacity = .5; pt.style.backgroundSize = '64px 64px';
    pt.style.backgroundImage = 'linear-gradient(rgba(190,140,255,.13) 1px, transparent 1px), linear-gradient(90deg, rgba(190,140,255,.13) 1px, transparent 1px)';
    pt.style.backgroundPosition = `${(t * 7) % 64}px ${(t * 11) % 64}px`;
  } else if (st === 1) {
    pt.style.opacity = .55; pt.style.backgroundSize = 'auto';
    pt.style.backgroundImage = 'repeating-linear-gradient(115deg, rgba(190,140,255,.10) 0 2px, transparent 2px 56px)';
    pt.style.backgroundPosition = `${(t * 18) % 56}px 0`;
  } else {
    pt.style.opacity = .6; pt.style.backgroundSize = 'auto';
    const r = 70 + (t * 22) % 70;
    pt.style.backgroundImage = `repeating-radial-gradient(circle at 70% 40%, rgba(190,140,255,.12) 0 2px, transparent 2px ${r}px)`;
    pt.style.backgroundPosition = '0 0';
  }
  dots.forEach(p => {
    const y = ((p.y - t * p.sp) % 760 + 760) % 760 - 20, x = p.x + Math.sin(t * .4 + p.ph) * 18;
    p.d.style.transform = `translate(${x}px, ${y}px)`; p.d.style.width = p.d.style.height = p.sz + 'px';
    p.d.style.opacity = (.35 + .35 * Math.sin(t * .8 + p.ph)).toFixed(3);
  });
  const gr = document.getElementById('grain'); gr.style.transform = `translate(${(Math.floor(t * 24) * 37) % 20}px, ${(Math.floor(t * 24) * 53) % 20}px)`;
}

function showVisual(o, t) {
  const v = o.v, lt = t - v.s, dur = v.e - v.s, root = o.root, dir = o.idx % 2 ? 1 : -1;
  if (lt < -0.01 || t > v.e + 0.01) { root.style.opacity = 0; return false; }
  const fin = eo(lt / .45), fout = 1 - clamp((lt - (dur - .25)) / .25);
  root.style.opacity = (fin * fout).toFixed(3);
  root.style.transform = `translateX(${dir * (1 - fin) * 70 - dir * (1 - fout) * 50}px) scale(${.95 + .05 * fin})`;
  if (v.type === 'date') {
    o.bar.style.width = (eo((lt - .15) / .8) * 520) + 'px';
    o.main.style.letterSpacing = (.06 - .05 * eo(lt / 1.2)) + 'em';
    if (o.sub) o.sub.style.opacity = eo((lt - .5) / .5);
  } else if (v.type === 'stat') {
    const p = eo(lt / 1.4), val = o.target * p;
    o.numv.textContent = o.dec ? val.toFixed(1).replace('.', ',') : Math.round(val);
    o.fill.style.width = (clamp(o.target / (v.max || 100)) * p * 100) + '%';
  } else if (v.type === 'verdict') {
    o.parts.forEach((c, i) => { const p = eob((lt - .3 - i * .5) / .5); c.style.opacity = clamp(p); c.style.transform = `translateX(${(1 - clamp(p)) * -90}px)`; });
  } else if (v.type === 'analogy') {
    o.parts.forEach((c, i) => { const p = eob((lt - .25 - i * .45) / .45); c.style.opacity = clamp(p); c.style.transform = `scale(${.85 + .15 * clamp(p)})`; });
  } else if (v.type === 'quote') {
    const n = o.parts.length, span = Math.max(.5, dur * .65);
    o.parts.forEach((w, i) => { const p = eob((lt - .1 - (i / n) * span) / .35); w.style.opacity = clamp(p); w.style.transform = `translateY(${(1 - clamp(p)) * 26}px) scale(${.8 + .2 * clamp(p)})`; });
    if (v.glitch) {
      // «глитч»: красно-голубое расслоение при появлении и короткие вспышки дальше; детерминировано от времени кадра
      const fr = Math.floor(t * 25), burst = (Math.abs(Math.sin(fr * 91.7)) > .93 && lt > .7) ? 1 : 0;
      const amp = (lt < .7 ? (1 - lt / .7) * 9 : 0) + burst * 6, jx = amp ? Math.sin(fr * 12.9) * amp * .8 : 0;
      o.q.style.textShadow = amp ? `${amp.toFixed(1)}px 0 rgba(255,60,90,.85), ${(-amp).toFixed(1)}px 0 rgba(60,200,255,.85)` : 'none';
      o.q.style.transform = `translateX(${jx.toFixed(1)}px)`;
    }
  } else if (v.type === 'timeline') {
    const n = o.parts.length; o.line.style.width = (130 + eo((lt - .1) / (0.5 + n * .45)) * 820) + 'px'; o.line.style.left = '0px';
    o.parts.forEach((p, i) => { const k = eob((lt - .3 - i * .5) / .5); p.style.opacity = clamp(k); p.style.transform = `translateY(${(1 - clamp(k)) * 30}px)`; });
  } else if (v.type === 'flow') {
    o.parts.forEach((p, i) => {
      const step = i / 2; // узел, связь, узел...
      if (p.n) { const k = eob((lt - .25 - step * .55) / .5); p.n.style.opacity = clamp(k); p.n.style.transform = `scale(${.6 + .4 * clamp(k)})`; }
      else { const k = eo((lt - .25 - (i - 1) / 2 * .55 - .25) / .35); p.f.style.width = (k * 100) + '%';
        const ph = ((t * 1.1) % 1); p.dot.style.opacity = k > .99 ? 1 : 0; p.dot.style.left = (ph * 100) + '%'; }
    });
  } else if (v.type === 'bars') {
    o.parts.forEach((p, i) => { const k = eo((lt - .25 - i * .35) / .9), a = clamp(lt - .25 - i * .35 + .2);
      p.r.style.opacity = clamp(a / .3); p.bf.style.width = (p.val / o.max * 100 * k) + '%';
      const val = p.val * k; p.bv.textContent = (Number.isInteger(p.val) ? Math.round(val) : val.toFixed(1).replace('.', ',')) + (o.unit ? ' ' + o.unit : ''); });
  } else if (v.type === 'poster') {
    const k = eob(lt / .6); o.paper.style.opacity = clamp(k * 2);
    o.paper.style.transform = `translateY(${(1 - clamp(k)) * -90}px) rotate(${o.rot * (1 + (1 - clamp(k)) * 4)}deg) scale(${1 + .04 * (1 - clamp(k))})`;
  } else if (v.type === 'terminal') {
    // строки печатаются по очереди; последняя напечатанная держит мигающий курсор
    let last = -1;
    o.lines.forEach((l, i) => {
      const start = .3 + i * .42, p = clamp((lt - start) / .34);
      const full = (l.k + l.r), n = Math.floor(full.length * p);
      l.kw.textContent = full.slice(0, Math.min(n, l.k.length)); l.rest.textContent = n > l.k.length ? full.slice(l.k.length, n) : '';
      if (p > 0) last = i;
    });
    o.lines.forEach((l, i) => { if (i === last && Math.floor(t * 2.2) % 2 === 0) l.rest.textContent += '█'; });
  } else if (v.type === 'icon') {
    const k = eob(lt / .55); o.ico.style.transform = `scale(${.4 + .6 * clamp(k)}) rotate(${(1 - clamp(k)) * -12}deg)`;
  }
  return true;
}

function subtitles(t) {
  let idx = -1;
  for (let i = 0; i < C.chunks.length; i++) { const c = C.chunks[i]; if (t >= c.s && t < c.e) { idx = i; break; } }
  const box = document.getElementById('sub');
  if (idx !== lastChunk) {
    lastChunk = idx; box.textContent = ''; chunkEls = [];
    if (idx >= 0) {
      const line = el('span', 'line');
      C.chunks[idx].w.forEach(w => { const s = el('span', 'w' + (w.k ? ' k' : ''), w.t); line.append(s); chunkEls.push(s); });
      box.append(line);
    }
  }
  if (idx >= 0) C.chunks[idx].w.forEach((w, i) => {
    const e = chunkEls[i], age = t - w.s; e.classList.toggle('on', age >= -.02);
    e.style.transform = age >= 0 && age < .22 ? `scale(${1 + .07 * (1 - age / .22)})` : 'none';   // всплеск слова в момент произнесения
  });
}

function seek(t) {
  const ci = chapterAt(t), ch = C.chapters[ci], lt = t - ch.s;
  bg(t, ci);
  const tag = document.getElementById('tag');
  document.getElementById('tagtxt').textContent = ch.label || '';
  tag.style.opacity = ch.label ? (eo(lt / .5) * (lt < 3 ? 1 : .72)).toFixed(3) : 0;
  tag.style.transform = `translateX(${(1 - eo(lt / .5)) * -60}px)`;
  let active = null;
  visEls.forEach(o => { if (showVisual(o, t)) active = o; });
  // камера: медленный наезд или отъезд на каждой сцене, плюс «удар» при входе в главу
  if (active) {
    const p = clamp((t - active.v.s) / Math.max(.5, active.v.e - active.v.s)), dir = active.idx % 2;
    const z = 1 + .05 * (dir ? 1 - p : p) + (ci > 0 || lt > 0 ? .09 * (1 - eo(lt / .7)) : 0);
    document.getElementById('cam').style.transform = `scale(${z.toFixed(4)}) translate(${((dir ? -1 : 1) * p * 12).toFixed(2)}px, ${(p * -6).toFixed(2)}px)`;
    const chip = document.getElementById('chip'), cp = eob((t - active.v.s - .2) / .4);
    chip.textContent = active.v.chip || ''; chip.style.opacity = active.v.chip ? clamp(cp) * (1 - clamp((t - (active.v.e - .25)) / .25)) : 0;
    chip.style.transform = `translateX(${(1 - clamp(cp)) * -40}px)`;
  }
  subtitles(t);
  document.getElementById('prog').style.width = (clamp(t / C.duration) * 100) + '%';
  // цветная шторка на смене главы: монтажная склейка, смена сцены прячется под ней
  const w = document.getElementById('wipe'), w2 = document.getElementById('wipe2');
  let wp = -1;
  C.chapters.forEach(c => { if (c.s > 0) { const p = (t - (c.s - .42)) / .85; if (p >= 0 && p <= 1) wp = p; } });  // середина шторки = момент смены
  if (wp >= 0) {
    w.style.opacity = 1; w2.style.opacity = 1;
    w.style.left = (-1800 + 3300 * eio(wp)) + 'px'; w2.style.left = (-1800 + 3300 * eio(clamp(wp - .12))) + 'px';
  } else { w.style.opacity = 0; w2.style.opacity = 0; }
}
window.seek = seek;
window.layoutDone = false;
document.fonts.ready.then(() => { layout(); seek(0); window.layoutDone = true; });
</script>
</body></html>
