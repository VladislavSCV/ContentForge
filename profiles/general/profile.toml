# Профиль general: познавательное медиа про психологию, науку, кризисы и общество.
# Всё, чего здесь нет (промпты, флаги), берётся из engineering. Копируй эту папку, чтобы завести новую команду.
extends = "engineering"
description = "Психология, наука, кризисы и общество для широкой аудитории"
sources_file = "assets/sources_general.txt"
stock_fallback = ["city night lights", "rain on window night", "dark abstract particles"]

[flags]
story_shorts = false
claim_layout = false
flow_layout = false
rubrics = false
code_warning = false
code_scene = false

# Столпов и рубрик у профиля нет: пустые таблицы заменяют унаследованные.
[pillars]
[rubrics]
[pillar_patterns]

